name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace -PbuildNumber=${{ github.run_number }}
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LeveEditor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LeveEditor-apk
          path: LeveEditor.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Leve Editor build ${{ github.run_number }}
          files: LeveEditor.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
